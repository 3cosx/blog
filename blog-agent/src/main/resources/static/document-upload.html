<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档中心 - 上传</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📄</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Noto+Serif+SC:wght@400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #FAF8F5;
            --bg-secondary: #F5F1EC;
            --bg-card: #FFFFFF;
            --accent-amber: #C17F24;
            --accent-amber-light: #E8A94B;
            --accent-amber-soft: rgba(193, 127, 36, 0.12);
            --text-primary: #2C2416;
            --text-secondary: #6B5D4D;
            --text-muted: #9C8B78;
            --border-light: rgba(44, 36, 22, 0.08);
            --border-medium: rgba(44, 36, 22, 0.15);
            --shadow-soft: 0 4px 24px rgba(44, 36, 22, 0.06);
            --shadow-medium: 0 8px 40px rgba(44, 36, 22, 0.1);
            --shadow-lifted: 0 16px 60px rgba(44, 36, 22, 0.14);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-xl: 28px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::selection {
            background: var(--accent-amber-soft);
            color: var(--text-primary);
        }

        body {
            font-family: 'DM Sans', 'Noto Serif SC', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Subtle paper texture overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.025;
            pointer-events: none;
            z-index: 0;
        }

        /* Decorative corner elements */
        .corner-decor {
            position: fixed;
            width: 200px;
            height: 200px;
            pointer-events: none;
            opacity: 0.4;
        }

        .corner-decor.top-left {
            top: 0;
            left: 0;
            background: radial-gradient(ellipse at top left, var(--accent-amber-soft) 0%, transparent 70%);
        }

        .corner-decor.bottom-right {
            bottom: 0;
            right: 0;
            background: radial-gradient(ellipse at bottom right, var(--accent-amber-soft) 0%, transparent 70%);
        }

        /* Main card */
        .upload-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 580px;
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lifted);
            padding: 52px 48px;
            border: 1px solid var(--border-light);
            animation: cardReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes cardReveal {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header section */
        .header {
            text-align: center;
            margin-bottom: 44px;
            animation: headerFade 0.7s ease-out 0.2s forwards;
            opacity: 0;
        }

        @keyframes headerFade {
            to { opacity: 1; }
        }

        .header-eyebrow {
            font-family: 'DM Sans', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent-amber);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header-eyebrow::before,
        .header-eyebrow::after {
            content: '';
            width: 24px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-amber), transparent);
        }

        .header-title {
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
            font-size: 38px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 2px;
            line-height: 1.2;
        }

        .header-title em {
            font-style: italic;
            color: var(--accent-amber);
        }

        .header-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 10px;
            letter-spacing: 1px;
        }

        /* Divider */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-medium), transparent);
            margin: 28px 0;
        }

        /* Form sections */
        .form-section {
            margin-bottom: 28px;
            animation: formSlide 0.6s ease-out backwards;
        }

        .form-section:nth-child(1) { animation-delay: 0.3s; }
        .form-section:nth-child(2) { animation-delay: 0.4s; }
        .form-section:nth-child(3) { animation-delay: 0.5s; }

        @keyframes formSlide {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .form-label span {
            color: var(--accent-amber);
            margin-left: 2px;
        }

        /* Input fields */
        .form-input {
            width: 100%;
            padding: 14px 18px;
            font-family: 'DM Sans', 'Noto Serif SC', sans-serif;
            font-size: 15px;
            color: var(--text-primary);
            background: var(--bg-secondary);
            border: 1px solid transparent;
            border-radius: var(--radius-md);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .form-input:hover {
            background: var(--bg-primary);
            border-color: var(--border-light);
        }

        .form-input:focus {
            background: var(--bg-card);
            border-color: var(--accent-amber);
            box-shadow: 0 0 0 4px var(--accent-amber-soft);
        }

        /* Drop zone */
        .drop-zone {
            position: relative;
            border: 2px dashed var(--border-medium);
            border-radius: var(--radius-lg);
            padding: 40px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--bg-secondary);
            overflow: hidden;
        }

        .drop-zone::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--accent-amber-soft) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .drop-zone:hover {
            border-color: var(--accent-amber);
            background: var(--bg-primary);
        }

        .drop-zone:hover::before {
            opacity: 1;
        }

        .drop-zone.dragover {
            border-color: var(--accent-amber);
            border-style: solid;
            background: var(--accent-amber-soft);
            transform: scale(1.01);
        }

        .drop-zone input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .drop-zone-content {
            position: relative;
            z-index: 1;
        }

        .drop-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--accent-amber-soft), transparent);
            border-radius: 50%;
            transition: transform 0.3s ease;
        }

        .drop-zone:hover .drop-icon {
            transform: translateY(-4px);
        }

        .drop-icon svg {
            width: 28px;
            height: 28px;
            stroke: var(--accent-amber);
            stroke-width: 1.5;
            fill: none;
        }

        .drop-text {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .drop-text strong {
            color: var(--accent-amber);
            font-weight: 600;
        }

        .drop-hint {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* File preview */
        .file-preview {
            display: none;
            margin-top: 16px;
            padding: 16px 20px;
            background: linear-gradient(135deg, var(--accent-amber-soft), rgba(232, 169, 75, 0.06));
            border: 1px solid rgba(193, 127, 36, 0.2);
            border-radius: var(--radius-md);
            animation: filePreviewIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .file-preview.show {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        @keyframes filePreviewIn {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(-8px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .file-preview-icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-soft);
        }

        .file-preview-icon svg {
            width: 22px;
            height: 22px;
            stroke: var(--accent-amber);
            stroke-width: 1.5;
            fill: none;
        }

        .file-preview-info {
            flex: 1;
            min-width: 0;
        }

        .file-preview-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-preview-size {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .file-preview-remove {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-card);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .file-preview-remove:hover {
            color: #DC2626;
            background: rgba(220, 38, 38, 0.1);
            transform: rotate(90deg);
        }

        /* Submit button */
        .submit-btn {
            width: 100%;
            padding: 18px 32px;
            margin-top: 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--bg-card);
            background: linear-gradient(135deg, var(--accent-amber) 0%, var(--accent-amber-light) 100%);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: btnReveal 0.6s ease-out 0.6s backwards;
        }

        @keyframes btnReveal {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transition: left 0.6s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(193, 127, 36, 0.35);
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .submit-btn:disabled:hover::before {
            left: -100%;
        }

        /* Loading state */
        .loading-state {
            display: none;
            text-align: center;
            margin-top: 20px;
            padding: 24px;
            animation: loadingPulse 1.5s ease-in-out infinite;
        }

        @keyframes loadingPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .loading-state .spinner {
            width: 32px;
            height: 32px;
            margin: 0 auto 12px;
            border: 2px solid var(--border-light);
            border-top-color: var(--accent-amber);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-state p {
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        /* Result message */
        .result-message {
            display: none;
            margin-top: 24px;
            padding: 20px 24px;
            border-radius: var(--radius-md);
            animation: resultIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes resultIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(-10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .result-message.success {
            display: block;
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.08), rgba(34, 197, 94, 0.04));
            border: 1px solid rgba(34, 197, 94, 0.25);
        }

        .result-message.error {
            display: block;
            background: linear-gradient(135deg, rgba(220, 38, 38, 0.08), rgba(220, 38, 38, 0.04));
            border: 1px solid rgba(220, 38, 38, 0.25);
        }

        .result-message-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .result-message-icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .result-message.success .result-message-icon {
            background: rgba(34, 197, 94, 0.15);
            color: #16A34A;
        }

        .result-message.error .result-message-icon {
            background: rgba(220, 38, 38, 0.15);
            color: #DC2626;
        }

        .result-message-title {
            font-size: 14px;
            font-weight: 600;
        }

        .result-message.success .result-message-title { color: #16A34A; }
        .result-message.error .result-message-title { color: #DC2626; }

        .result-message-content {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .result-message-content code {
            display: block;
            margin-top: 10px;
            padding: 10px 14px;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            font-family: 'DM Sans', monospace;
            font-size: 12px;
            color: var(--text-primary);
            word-break: break-all;
        }

        /* Footer */
        .footer-link {
            display: block;
            text-align: center;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border-light);
            text-decoration: none;
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
            animation: footerFade 0.5s ease-out 0.7s backwards;
        }

        @keyframes footerFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .footer-link:hover {
            color: var(--accent-amber);
        }

        .footer-link svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            vertical-align: middle;
            margin-right: 6px;
        }

        /* Responsive */
        @media (max-width: 640px) {
            body {
                padding: 24px 16px;
            }

            .upload-card {
                padding: 36px 24px;
            }

            .header-title {
                font-size: 30px;
            }

            .drop-zone {
                padding: 32px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="corner-decor top-left"></div>
    <div class="corner-decor bottom-right"></div>

    <div class="upload-card">
        <header class="header">
            <div class="header-eyebrow">文档管理</div>
            <h1 class="header-title">上传你的 <em>文档</em></h1>
            <p class="header-subtitle">支持拖拽或点击选择文件上传</p>
        </header>

        <div class="divider"></div>

        <form id="uploadForm">
            <div class="form-section">
                <label class="form-label">文件 <span>*</span></label>
                <div class="drop-zone" id="dropZone">
                    <input type="file" id="fileInput" name="file" accept="*/*" required>
                    <div class="drop-zone-content">
                        <div class="drop-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                        </div>
                        <p class="drop-text">拖拽文件到此处，或 <strong>点击选择</strong></p>
                        <p class="drop-hint">支持任意格式，单文件大小不限</p>
                    </div>
                </div>
                <div class="file-preview" id="filePreview">
                    <div class="file-preview-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                            <polyline points="10 9 9 9 8 9"/>
                        </svg>
                    </div>
                    <div class="file-preview-info">
                        <div class="file-preview-name" id="fileName"></div>
                        <div class="file-preview-size" id="fileSize"></div>
                    </div>
                    <button type="button" class="file-preview-remove" id="fileRemove" title="移除文件">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-section">
                <label class="form-label" for="docTitle">文档标题</label>
                <input type="text" class="form-input" id="docTitle" name="docTitle" placeholder="给文档起个标题">
            </div>

            <div class="form-section">
                <label class="form-label" for="uploadUser">上传用户 <span>*</span></label>
                <input type="text" class="form-input" id="uploadUser" name="uploadUser" placeholder="你的用户名" required>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                开始上传
            </button>

            <div class="loading-state" id="loadingState">
                <div class="spinner"></div>
                <p>正在上传，请稍候...</p>
            </div>

            <div class="result-message" id="resultMessage">
                <div class="result-message-header">
                    <div class="result-message-icon">
                        <svg id="resultIconSuccess" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                        <svg id="resultIconError" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="15" y1="9" x2="9" y2="15"/>
                            <line x1="9" y1="9" x2="15" y2="15"/>
                        </svg>
                    </div>
                    <span class="result-message-title" id="resultTitle"></span>
                </div>
                <div class="result-message-content" id="resultContent"></div>
            </div>
        </form>

        <a href="/" class="footer-link">
            <svg viewBox="0 0 24 24">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
            </svg>
            返回首页
        </a>
    </div>

    <script>
        const uploadForm = document.getElementById('uploadForm');
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const filePreview = document.getElementById('filePreview');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const fileRemove = document.getElementById('fileRemove');
        const submitBtn = document.getElementById('submitBtn');
        const loadingState = document.getElementById('loadingState');
        const resultMessage = document.getElementById('resultMessage');
        const resultTitle = document.getElementById('resultTitle');
        const resultContent = document.getElementById('resultContent');
        const resultIconSuccess = document.getElementById('resultIconSuccess');
        const resultIconError = document.getElementById('resultIconError');

        // Backend URL - adjust as needed
        const API_BASE = '/knowledge';

        // Drag and drop handlers
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
            });
        });

        dropZone.addEventListener('drop', (e) => {
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                showFileInfo(e.dataTransfer.files[0]);
            }
        });

        // File input change
        fileInput.addEventListener('change', function() {
            if (this.files[0]) {
                showFileInfo(this.files[0]);
            }
        });

        function showFileInfo(file) {
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            filePreview.classList.add('show');
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(2) + ' MB';
            return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
        }

        fileRemove.addEventListener('click', () => {
            fileInput.value = '';
            filePreview.classList.remove('show');
        });

        // Form submit
        uploadForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const file = fileInput.files[0];
            if (!file) {
                showResult('error', '请选择要上传的文件');
                return;
            }

            const docTitle = document.getElementById('docTitle').value || file.name;
            const uploadUser = document.getElementById('uploadUser').value;

            if (!uploadUser) {
                showResult('error', '请填写上传用户');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);
            formData.append('docTitle', docTitle);
            formData.append('uploadUser', uploadUser);

            submitBtn.disabled = true;
            loadingState.style.display = 'block';
            resultMessage.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/documents/upload`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok && result.code === 200) {
                    const data = result.data || {};
                    let message = `文档ID: ${data.docId || 'N/A'}\n`;
                    message += `标题: ${data.docTitle || docTitle}\n`;
                    message += `URL: ${data.docUrl || 'N/A'}`;
                    showResult('success', '上传成功', message);
                    uploadForm.reset();
                    filePreview.classList.remove('show');
                } else {
                    showResult('error', '上传失败', result.message || '服务器返回错误');
                }
            } catch (error) {
                showResult('error', '上传失败', error.message);
            } finally {
                submitBtn.disabled = false;
                loadingState.style.display = 'none';
            }
        });

        function showResult(type, title, message) {
            resultMessage.className = 'result-message ' + type;
            resultTitle.textContent = title;
            resultContent.innerHTML = message ? `<code>${message}</code>` : '';

            if (type === 'success') {
                resultIconSuccess.style.display = 'block';
                resultIconError.style.display = 'none';
            } else {
                resultIconSuccess.style.display = 'none';
                resultIconError.style.display = 'block';
            }

            resultMessage.style.display = 'block';
        }
    </script>
</body>
</html>
