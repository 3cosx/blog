<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识引擎 · Chat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#9889;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg-page: #fafaf8;
  --bg-panel: #f5f4f0;
  --bg-surface: #ffffff;
  --bg-hover: #f0eee8;
  --bg-active: #ebe8e0;
  --border: #e5e2da;
  --border-light: #dcd8ce;
  --text-primary: #2c2820;
  --text-secondary: #787468;
  --text-muted: #b0aa9e;
  --accent: #b8942e;
  --accent-dim: rgba(184, 148, 46, 0.08);
  --accent-soft: rgba(184, 148, 46, 0.15);
  --accent-text: #8b6918;
  --user-bg: #f3f5f9;
  --user-border: #dde2ed;
  --user-label: #5b7eb5;
  --danger: #c0392b;
  --danger-dim: rgba(192, 57, 43, 0.08);
  --font-mono: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
  --font-serif: 'Noto Serif SC', 'Source Han Serif SC', serif;
  --radius: 6px;
  --radius-lg: 10px;
  --transition: 180ms cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%; width: 100%;
  background: var(--bg-page);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 14px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.app { display: flex; height: 100vh; }

/* ── Sidebar ── */
.sidebar {
  width: 290px; min-width: 290px; background: var(--bg-panel);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  transition: transform 220ms cubic-bezier(0.4, 0, 0.2, 1);
}
.sidebar-header {
  padding: 18px 16px 12px; border-bottom: 1px solid var(--border);
}
.brand {
  display: flex; align-items: center; gap: 9px;
  font-family: var(--font-serif); font-size: 18px; font-weight: 700;
  color: var(--text-primary); letter-spacing: 0.02em;
  margin-bottom: 13px; user-select: none;
}
.brand .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent);
}
.new-conv-btn {
  width: 100%; padding: 9px 0; background: var(--bg-surface);
  border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text-secondary); font-family: var(--font-mono);
  font-size: 11.5px; font-weight: 500; cursor: pointer;
  letter-spacing: 0.03em; transition: all var(--transition);
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.new-conv-btn:hover { border-color: var(--accent); color: var(--accent-text); background: var(--accent-dim); }
.conv-list { flex: 1; overflow-y: auto; padding: 4px 0; }
.conv-list::-webkit-scrollbar { width: 3px; }
.conv-list::-webkit-scrollbar-track { background: transparent; }
.conv-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.conv-item {
  padding: 11px 16px; cursor: pointer;
  border-left: 2px solid transparent;
  transition: all var(--transition);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.conv-item:hover { background: var(--bg-hover); }
.conv-item.active { background: var(--bg-active); border-left-color: var(--accent); }
.conv-item .conv-title {
  font-size: 12.5px; font-weight: 500; color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.01em;
}
.conv-item .conv-time { font-size: 10px; color: var(--text-muted); flex-shrink: 0; }

.sidebar-footer {
  padding: 10px 16px; border-top: 1px solid var(--border);
  font-size: 10px; color: var(--text-muted); display: flex; align-items: center; gap: 6px;
}
.sidebar-footer .status-dot { width: 5px; height: 5px; border-radius: 50%; background: #4caf50; }

/* ── Thinking indicator ── */
.think-indicator {
  display: none; align-items: center; gap: 8px; margin-top: 6px;
  font-size: 11.5px; color: var(--text-secondary); font-family: var(--font-mono);
  letter-spacing: 0.03em; user-select: none;
}
.think-spinner {
  width: 14px; height: 14px; border: 2px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.think-done {
  width: 14px; height: 14px; border-radius: 50%;
  background: #4caf50; color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700; flex-shrink: 0;
}
.think-indicator.done .think-spinner { display: none; }
.think-indicator:not(.done) .think-done { display: none; }

/* ── Main ── */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg-page); }
.main-header {
  padding: 12px 22px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; min-height: 50px;
  background: var(--bg-surface);
}
.main-header .conv-title-display {
  font-family: var(--font-serif); font-size: 15px; font-weight: 600;
  color: var(--text-primary); max-width: 460px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.main-header .conv-meta { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
.mobile-menu-btn { display: none; background: none; border: none; color: var(--text-secondary); font-size: 17px; cursor: pointer; padding: 4px 8px; }

/* ── Messages ── */
.messages { flex: 1; overflow-y: auto; padding: 22px 28px; scroll-behavior: smooth; }
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.empty-state {
  height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; gap: 10px;
  opacity: 0.45; user-select: none;
}
.empty-state .empty-icon { font-size: 44px; margin-bottom: 4px; }
.empty-state h2 { font-family: var(--font-serif); font-size: 21px; font-weight: 600; color: var(--text-primary); }
.empty-state p { font-size: 12.5px; color: var(--text-secondary); }

.msg-row {
  display: flex; gap: 11px; margin-bottom: 24px;
  animation: msgIn 260ms ease-out;
}
.msg-row.user { flex-direction: row-reverse; }
.msg-row.user .msg-body { display: flex; flex-direction: column; align-items: flex-end; }
.msg-row.user .msg-content {
  background: var(--user-bg); border: 1px solid var(--user-border);
  border-radius: var(--radius-lg) 0 var(--radius-lg) var(--radius-lg);
  padding: 10px 14px;
}
@keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.msg-avatar {
  width: 30px; height: 30px; border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0; margin-top: 1px;
}
.msg-row.user .msg-avatar { background: var(--bg-hover); border: 1px solid var(--border-light); }
.msg-row.ai .msg-avatar { background: var(--accent-dim); border: 1px solid rgba(184,148,46,0.2); }

.msg-body { flex: 1; min-width: 0; }
.msg-label {
  font-size: 10px; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; margin-bottom: 3px; user-select: none;
}
.msg-row.user .msg-label { color: var(--user-label); }
.msg-row.ai .msg-label { color: var(--accent-text); }

.msg-content {
  font-size: 13.5px; line-height: 1.72; color: var(--text-primary);
  word-break: break-word;
}
.msg-content p { margin-bottom: 7px; }
.msg-content p:last-child { margin-bottom: 0; }
.msg-content pre {
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 14px;
  overflow-x: auto; font-size: 11.5px; line-height: 1.5; margin: 8px 0;
}
.msg-content code { font-family: var(--font-mono); font-size: 11.5px; background: var(--bg-hover); padding: 1px 5px; border-radius: 3px; }
.msg-content pre code { background: none; padding: 0; }
.msg-content ul, .msg-content ol { margin: 6px 0; padding-left: 18px; }
.msg-content li { margin-bottom: 3px; }
.msg-content blockquote {
  border-left: 3px solid var(--accent); padding: 5px 12px;
  margin: 8px 0; color: var(--text-secondary);
  background: var(--accent-dim); border-radius: 0 var(--radius) var(--radius) 0;
}
.msg-content a { color: var(--accent-text); text-decoration: none; }
.msg-content a:hover { text-decoration: underline; }
.msg-content table { border-collapse: collapse; margin: 8px 0; font-size: 12px; }
.msg-content th, .msg-content td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
.msg-content th { background: var(--bg-panel); font-weight: 600; }

/* Typing indicator */
.typing-dots { display: flex; gap: 4px; padding: 3px 0; }
.typing-dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: bounce 1.2s infinite ease-in-out; }
.typing-dots span:nth-child(2) { animation-delay: 0.15s; }
.typing-dots span:nth-child(3) { animation-delay: 0.3s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.35; } 30% { transform: translateY(-5px); opacity: 1; } }

/* ── Input ── */
.input-area { padding: 14px 22px 18px; border-top: 1px solid var(--border); flex-shrink: 0; background: var(--bg-surface); }
.input-wrap {
  display: flex; align-items: flex-end; gap: 8px; background: var(--bg-page);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 7px 7px 7px 14px; transition: border-color var(--transition);
}
.input-wrap:focus-within { border-color: var(--accent); }
.input-wrap textarea {
  flex: 1; background: none; border: none; outline: none;
  color: var(--text-primary); font-family: var(--font-mono);
  font-size: 12.5px; resize: none; max-height: 130px; line-height: 1.5; padding: 5px 0;
}
.input-wrap textarea::placeholder { color: var(--text-muted); }
.send-btn {
  width: 36px; height: 36px; border-radius: var(--radius); border: none; cursor: pointer;
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-size: 13px; transition: all var(--transition);
  background: var(--accent-soft); color: var(--accent-text);
}
.send-btn:hover:not(:disabled) { background: var(--accent); color: #fff; }
.send-btn.stop-btn { background: var(--danger-dim); color: var(--danger); }
.send-btn.stop-btn:hover { background: var(--danger); color: #fff; }
.send-btn:disabled { opacity: 0.25; cursor: not-allowed; }
.input-hint { font-size: 9.5px; color: var(--text-muted); text-align: center; margin-top: 7px; letter-spacing: 0.03em; }

/* ── Skeleton ── */
.skeleton { background: linear-gradient(90deg, var(--bg-hover) 25%, var(--bg-panel) 50%, var(--bg-hover) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: var(--radius); }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* ── Toast ── */
.toast {
  position: fixed; top: 18px; right: 18px; z-index: 10001;
  padding: 10px 18px; border-radius: var(--radius); font-size: 11.5px;
  font-family: var(--font-mono); animation: slideIn 240ms ease-out; max-width: 360px;
}
.toast.error { background: #fef2f2; border: 1px solid var(--danger); color: #991b1b; }
@keyframes slideIn { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: translateX(0); } }

.loading-pulse { display: flex; align-items: center; justify-content: center; padding: 24px; }
.loading-pulse span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin: 0 3px; animation: bounce 1.2s infinite ease-in-out; }
.loading-pulse span:nth-child(2) { animation-delay: 0.15s; }
.loading-pulse span:nth-child(3) { animation-delay: 0.3s; }

@media (max-width: 680px) {
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 100; }
  .sidebar.hidden { transform: translateX(-100%); }
  .mobile-menu-btn { display: block; }
  .main-header { padding: 10px 14px; }
  .messages { padding: 14px; }
  .input-area { padding: 10px 14px 14px; }
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand"><span class="dot"></span>知识引擎</div>
      <button class="new-conv-btn" onclick="newConversation()">+ 新建对话</button>
    </div>
    <div class="conv-list" id="convList"></div>
    <div class="sidebar-footer"><span class="status-dot"></span> 已连接</div>
  </aside>

  <main class="main">
    <header class="main-header">
      <button class="mobile-menu-btn" onclick="toggleSidebar()">&#9776;</button>
      <span class="conv-title-display" id="convTitle">新对话</span>
      <span class="conv-meta" id="convMeta"></span>
    </header>

    <div class="messages" id="messages">
      <div class="empty-state">
        <div class="empty-icon">&#9889;</div>
        <h2>知识引擎</h2>
        <p>基于 RAG 的智能知识问答系统</p>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="msgInput" rows="1" placeholder="输入问题... (Enter 发送, Shift+Enter 换行)"
          onkeydown="handleKeydown(event)" oninput="autoGrow(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendOrStop()" title="发送 (Enter)">&#10148;</button>
      </div>
      <div class="input-hint">Enter 发送 &middot; Shift+Enter 换行</div>
    </div>
  </main>
</div>
<div id="toastBox"></div>

<script>
const S = {
  convs: [], convId: null, msgs: [],
  sending: false, abort: null,
  streamEl: null  // DOM element of streaming AI message content
};
const $ = s => document.querySelector(s);

function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast error'; el.textContent = msg;
  $('#toastBox').appendChild(el); setTimeout(() => el.remove(), 4200);
}

const BASE = '/knowledge';

async function api(path, opts = {}) {
  const res = await fetch(BASE + path, opts);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (json.code === 200) return json.data;
  throw new Error(json.message || '请求失败');
}

async function loadConvs() {
  try {
    const data = await api('/conversations?userId=user');
    S.convs = Array.isArray(data) ? data : [];
    renderConvs();
  } catch (e) {
    console.error('loadConvs error:', e);
    $('#convList').innerHTML = '<div style="padding:16px;color:var(--text-muted);font-size:11.5px;">加载失败: ' + escHtml(e.message) + '</div>';
  }
}

function renderConvs() {
  const el = $('#convList');
  if (!S.convs.length) { el.innerHTML = '<div style="padding:16px;color:var(--text-muted);font-size:11.5px;">暂无会话</div>'; return; }
  el.innerHTML = S.convs.map(c => {
    const active = c.conversationId === S.convId ? ' active' : '';
    const t = c.createTime ? fmtTime(c.createTime) : '';
    return `<div class="conv-item${active}" onclick="selectConv('${escHtml(c.conversationId)}')">
      <span class="conv-title">${escHtml(c.title || '新对话')}</span>
      <span class="conv-time">${t}</span></div>`;
  }).join('');
}

function fmtTime(t) {
  const d = new Date(t), now = Date.now(), diff = now - d.getTime();
  if (diff < 6e4) return '刚刚';
  if (diff < 36e5) return Math.floor(diff / 6e4) + '分前';
  if (diff < 864e5) return Math.floor(diff / 36e5) + '时前';
  return ('0'+(d.getMonth()+1)).slice(-2) + '/' + ('0'+d.getDate()).slice(-2);
}

function escHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

async function selectConv(id) {
  S.convId = id; S.msgs = []; S.streamEl = null; renderConvs(); updateHdr();
  $('#messages').innerHTML = '<div class="loading-pulse"><span></span><span></span><span></span></div>';
  try {
    const data = await api('/conversations/' + encodeURIComponent(id) + '/messages');
    S.msgs = Array.isArray(data) ? [...data].reverse() : [];
    fullRender(); scrollBottom();
  } catch (e) { $('#messages').innerHTML = '<div class="empty-state"><p>加载消息失败</p></div>'; }
}

function newConversation() {
  S.convId = null; S.msgs = []; S.streamEl = null;
  updateHdr(); renderConvs();
  $('#messages').innerHTML = '<div class="empty-state"><div class="empty-icon">&#9889;</div><h2>知识引擎</h2><p>基于 RAG 的智能知识问答系统</p></div>';
  $('#msgInput').focus();
}

function updateHdr() {
  const c = S.convs.find(x => x.conversationId === S.convId);
  $('#convTitle').textContent = c ? (c.title || '新对话') : '新对话';
  $('#convMeta').textContent = S.msgs.length ? S.msgs.length + ' 条消息' : '';
}

// Full re-render (for initial load / conversation switch)
function fullRender() {
  S.streamEl = null;
  $('#messages').innerHTML = S.msgs.map((m, i) => msgHTML(m, i)).join('');
}

function msgHTML(m, idx) {
  const isUser = m.type === 'USER';
  const content = isUser ? escHtml(m.content || '') : marked.parse(m.content || '');
  return `<div class="msg-row ${isUser ? 'user' : 'ai'}" data-msgidx="${idx}">
    <div class="msg-avatar">${isUser ? '&#128100;' : '&#9889;'}</div>
    <div class="msg-body">
      <div class="msg-label">${isUser ? 'YOU' : 'ASSISTANT'}</div>
      <div class="msg-content">${content}</div>
      ${!isUser ? '<div class="think-indicator"><span class="think-spinner"></span><span class="think-done">✓</span><span class="think-text"></span></div>' : ''}
    </div>
  </div>`;
}

// Get or create the last AI message row
function ensureAiRow() {
  const msgsEl = $('#messages');
  let row = msgsEl.querySelector('.msg-row.ai:last-child');
  if (!row) {
    const idx = S.msgs.length - 1;
    msgsEl.insertAdjacentHTML('beforeend', msgHTML(S.msgs[idx], idx));
    row = msgsEl.querySelector('.msg-row.ai:last-child');
  }
  return row;
}

// Update only the content of the last AI message
function streamUpdate(rawText) {
  const row = ensureAiRow();
  if (row) {
    const contentEl = row.querySelector('.msg-content');
    if (contentEl) {
      contentEl.innerHTML = marked.parse(rawText);
      S.streamEl = contentEl;
    }
  }
  scrollBottom();
}

// Show thinking state: spinner with message
function showThinking(msg) {
  const row = ensureAiRow();
  const indicator = row.querySelector('.think-indicator');
  if (indicator) {
    indicator.classList.remove('done');
    indicator.style.display = 'flex';
    indicator.querySelector('.think-text').textContent = msg || '思考中...';
  }
  scrollBottom();
}

// Mark thinking as complete: spinner → ✓
function finishThinking() {
  const row = ensureAiRow();
  const indicator = row.querySelector('.think-indicator');
  if (indicator) {
    indicator.classList.add('done');
    indicator.querySelector('.think-text').textContent = '思考完成';
  }
}

// Update thinking text without resetting spinner → ✓
function updateThinkingText(msg) {
  const msgsEl = $('#messages');
  const row = msgsEl.querySelector('.msg-row.ai:last-child');
  if (row) {
    const indicator = row.querySelector('.think-indicator');
    if (indicator) {
      indicator.querySelector('.think-text').textContent = msg || '';
    }
  }
}

// Hide thinking indicator (conversation done)
function hideThinking() {
  const msgsEl = $('#messages');
  const row = msgsEl.querySelector('.msg-row.ai:last-child');
  if (row) {
    const indicator = row.querySelector('.think-indicator');
    if (indicator) indicator.style.display = 'none';
  }
}

function scrollBottom() {
  requestAnimationFrame(() => { const el = $('#messages'); el.scrollTop = el.scrollHeight; });
}

// ── Send ──
function sendOrStop() {
  if (S.sending) { stopSend(); return; }
  const q = $('#msgInput').value.trim(); if (!q) return;

  S.msgs.push({ type: 'USER', content: q });
  $('#msgInput').value = ''; autoGrow($('#msgInput'));
  fullRender(); scrollBottom();

  const aiMsg = { type: 'AI', content: '' };
  S.msgs.push(aiMsg);
  S.streamEl = null;

  S.sending = true;
  $('#sendBtn').classList.add('stop-btn'); $('#sendBtn').innerHTML = '&#9632;';
  doChat(q, aiMsg).catch(e => {
    if (e.name !== 'AbortError') { aiMsg.content = '**请求失败**: ' + escHtml(e.message); fullRender(); toast(e.message); }
  }).finally(() => {
    S.sending = false; S.abort = null; S.streamEl = null;
    $('#sendBtn').classList.remove('stop-btn'); $('#sendBtn').innerHTML = '&#10148;';
  });
}

function stopSend() { if (S.abort) { S.abort.abort(); S.abort = null; } }

async function doChat(question, aiMsg) {
  S.abort = new AbortController();
  const fd = new URLSearchParams(); fd.append('question', question);
  if (S.convId) fd.append('conversationId', S.convId);

  const res = await fetch(BASE + '/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: fd.toString(),
    signal: S.abort.signal
  });
  if (!res.ok) {
    let msg = 'HTTP ' + res.status;
    try { const e = await res.json(); if (e.message) msg = e.message; if (e.error) msg = e.error; } catch {}
    throw new Error(msg);
  }

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  let thinkingActive = false;
  let contentStarted = false;

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n'); buf = lines.pop() || '';
    for (const line of lines) {
      const chunk = parseSSE(line);
      if (chunk === null) continue;

      if (chunk.startsWith('[PROGRESS]')) {
        const progressText = chunk.substring(10).trim();
        if (!contentStarted) {
          showThinking(progressText);
        } else {
          updateThinkingText(progressText);
        }
        thinkingActive = true;
        continue;
      }

      if (chunk.startsWith('[DONE]')) {
        const doneConvId = chunk.substring(6).trim();
        if (doneConvId && !S.convId) { S.convId = doneConvId; updateHdr(); }
        hideThinking();
        thinkingActive = false;
        continue;
      }

      if (chunk.startsWith('[ERROR]')) {
        const errMsg = chunk.substring(7).trim();
        hideThinking();
        aiMsg.content += '\n\n⚠️ **错误**: ' + escHtml(errMsg);
        fullRender();
        continue;
      }

      // Regular AI content — first token: switch spinner to ✓
      if (!contentStarted) {
        finishThinking();
        contentStarted = true;
      }
      aiMsg.content += chunk;
      streamUpdate(aiMsg.content);
    }
  }

  // Flush remaining buffer
  if (buf.trim()) {
    for (const line of buf.split('\n')) {
      const chunk = parseSSE(line);
      if (chunk === null) continue;
      if (chunk.startsWith('[PROGRESS]')) {
        const t = chunk.substring(10).trim();
        if (!contentStarted) showThinking(t); else updateThinkingText(t);
        thinkingActive = true; continue;
      }
      if (chunk.startsWith('[DONE]')) {
        const doneConvId = chunk.substring(6).trim();
        if (doneConvId && !S.convId) { S.convId = doneConvId; updateHdr(); }
        hideThinking(); continue;
      }
      if (chunk.startsWith('[ERROR]')) { aiMsg.content += '\n\n⚠️ **错误**: ' + escHtml(errMsg); continue; }
      if (!contentStarted) { finishThinking(); contentStarted = true; }
      aiMsg.content += chunk;
    }
  }
  hideThinking();

  fullRender(); scrollBottom();

  await new Promise(r => setTimeout(r, 300));
  await loadConvs();
  if (!S.convId && S.convs.length) { S.convId = S.convs[0].conversationId; }
  renderConvs(); updateHdr();
}

function parseSSE(line) {
  // Strip SSE "data:" prefix
  let data = line;
  if (line.startsWith('data:')) data = line.substring(5).replace(/^[ \t]+/, '');
  else if (line.trim() === '' || line.startsWith(':')) return null;
  data = data.trim();
  // Unwrap JSON-quoted strings
  if (data.startsWith('"') && data.endsWith('"')) {
    try { data = JSON.parse(data); } catch {}
  }
  return data;
}

function handleKeydown(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendOrStop(); } }
function autoGrow(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 130) + 'px'; }
function toggleSidebar() { $('#sidebar').classList.toggle('hidden'); }

loadConvs(); $('#msgInput').focus();
</script>
