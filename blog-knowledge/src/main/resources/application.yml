server:
  port: 8009

spring:
  application:
    name: KnowEngine
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://192.168.10.10:3306/blog?rewriteBatchedStatements=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin
  data:
    redis:
      host: 192.168.10.10
      port: 6379
      password: 123456
      ssl:
        enabled: true
  redis:
    redisson:
      config: |
        singleServerConfig:
          idleConnectionTimeout: 10000
          connectTimeout: 10000
          timeout: 3000
          retryAttempts: 3
          retryInterval: 1500
          password: knowengine
          subscriptionsPerConnection: 5
          clientName: null
          address: "redis://localhost:6379"
          subscriptionConnectionMinimumIdleSize: 1
          subscriptionConnectionPoolSize: 50
          connectionMinimumIdleSize: 24
          connectionPoolSize: 64
          database: 0
          dnsMonitoringInterval: 5000
        threads: 16
        nettyThreads: 32
        codec: !<org.redisson.codec.JsonJacksonCodec> {}
        transportMode: "NIO"

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:/mapper/**/*.xml

langchain4j:
  open-ai:
    chat-model:
      api-key: @dashscope.api.key@
      model-name: qwen-max-latest
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      log-requests: true
      log-responses: true
    streaming-chat-model:
      api-key: @dashscope.api.key@
      model-name: qwen-max-latest
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      log-requests: true
      log-responses: true

elasticsearch:
  host: http://192.168.10.10:9200
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model-name: text-embedding-v4
  api-key: @dashscope.api.key@
  dimensions: 1536

minio:
  url: http://112.126.84.219:9001/
  accessKey: admin
  secretKey: admin123456
  bucketName: rag-test
  endpoint: http://112.126.84.219:9000/

https://mineru:
  net/api/v4/extract/task:
# 文件解析服务配置
file:
  parse:
    api:
      url: http://47.104.64.223:8000

# XXL-Job 配置
xxl:
  job:
    admin:
      addresses: http://192.168.10.10:8080/xxl-job-admin
    accessToken: default_token
    executor:
      appname: konwledgeExecutor

document:
  processor:
    temp-dir: ${java.io.tmpdir}/knowledge-document
    cleanup-after-process: true
  mineru:
    extract-url: ${file.parse.api.url}/api/v4/extract/task
    file-param-name: file
    response-format-param-name: output_format
    response-format: zip
  vision:
    enabled: true
    api-key: ${langchain4j.open-ai.chat-model.api-key}
    base-url: ${langchain4j.open-ai.chat-model.base-url}
    model-name: qwen-vl-max-latest
    prompt: 请用一句简洁准确的中文描述图片的核心内容，不要带序号，不要输出“这是一张图”之类的前缀。
